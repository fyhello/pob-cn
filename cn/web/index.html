<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoB Next-Gen (流放之路2 现代配装模拟器)</title>
    <!-- 全局现代字体定义 -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        background-color: #0a0a0c;
        color: #e0e0e0;
        user-select: none;
        overflow: hidden;
      }
      .font-poe-title {
        font-family: 'Cinzel', "Microsoft YaHei", serif;
      }
      /* 自定义暗黑毛玻璃滚动条 */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
      }
      ::-webkit-scrollbar-thumb {
        background: #2a2a35;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3e3e4f;
      }
    </style>
  </head>
  <body class="bg-poe-bg text-gray-200 antialiased h-screen w-screen overflow-hidden">
    <div id="app" class="h-full w-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
